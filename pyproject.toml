# NexRT is run from source (the custom CUDA kernels JIT-compile at runtime); this file provides
# project metadata + the version. See README.md for setup and the run workflow.
[project]
name = "NexRT"
version = "0.3.0"
description = "Low-latency autoregressive decoding engine using whole-step CUDA graph replay and specialized CUDA kernels."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["llm", "inference", "decode", "cuda-graph", "tensor-parallel", "fp8", "moe", "low-latency"]

dependencies = [
    "torch>=2.6",
    "safetensors>=0.4",
]

[project.optional-dependencies]
prefill = ["sglang", "transformers>=4.45", "tokenizers>=0.20", "numpy>=1.24"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "N801", "N802"]
# Short local call adapters may use lambdas.
ignore = ["E731"]

[tool.ruff.lint.pep8-naming]
# Preserve the existing tensor property used by the decode runtimes.
extend-ignore-names = ["W_fused"]
